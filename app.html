<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>조선양록회 &amp; 슬로우라이프</title>
<meta name="theme-color" content="#0d0b09">
<link rel="icon" href="icon/favicon.ico" sizes="any">
<link rel="icon" type="image/png" sizes="32x32" href="icon/favicon-32.png">
<link rel="apple-touch-icon" href="icon/apple-touch-icon.png">
<link rel="manifest" href="manifest.json">
<link href="https://fonts.googleapis.com/css2?family=Dokdo&family=Song+Myung&family=Noto+Sans+KR:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{
  --ink:#0d0b09; --ink-2:#17130f; --card:#1c1814; --line:rgba(216,178,106,.22);
  --paper:#efe4cf; --muted:#a8987d; --gold:#d8b26a; --gold-2:#a8823f; --red:#a3241c; --red-2:#c9372a; --navy:#24304a;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{background:var(--ink)}
body{word-break:keep-all;font-family:'Noto Sans KR',system-ui,sans-serif;color:var(--paper);-webkit-font-smoothing:antialiased;min-height:100vh;
  background:
    radial-gradient(900px 400px at 50% -120px,rgba(163,36,28,.18),transparent 70%),
    linear-gradient(180deg,#120f0c,var(--ink) 400px)}
a{color:inherit;text-decoration:none}
.wrap{max-width:1180px;margin:0 auto;padding:0 20px}

/* ============ 헤더 ============ */
header{position:sticky;top:0;z-index:10;background:rgba(13,11,9,.88);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);
  border-bottom:1px solid var(--line)}
.bar{display:flex;align-items:center;gap:28px;height:72px}
.brand{display:flex;align-items:center;gap:12px;flex:0 0 auto}
.brand img{width:44px;height:44px;border-radius:11px;box-shadow:0 0 0 1px rgba(216,178,106,.5),0 4px 12px rgba(0,0,0,.5)}
.brand .name{font-family:'Dokdo',cursive;font-size:28px;line-height:.9;color:#fbf4e6;-webkit-text-stroke:.03em #fbf4e6;letter-spacing:-.04em}
.brand .name small{display:block;font-size:.58em;color:#e9dcc0;-webkit-text-stroke:0}
nav.menu{display:flex;gap:4px;flex:1;justify-content:center}
nav.menu a{position:relative;padding:10px 16px;font-family:'Song Myung',serif;font-size:17px;letter-spacing:.06em;color:#cdbf9f;border-radius:4px;transition:color .2s}
nav.menu a:hover{color:#fff}
nav.menu a.on{color:var(--gold)}
nav.menu a.on::after{content:"";position:absolute;left:16px;right:16px;bottom:2px;height:2px;
  background:linear-gradient(90deg,transparent,var(--gold),transparent)}
.social{display:flex;gap:8px;flex:0 0 auto}
.social a{width:36px;height:36px;border-radius:50%;display:grid;place-items:center;background:rgba(239,228,207,.06);
  border:1px solid rgba(216,178,106,.25);transition:background .2s}
.social a:hover{background:rgba(216,178,106,.15)}
.social svg{width:18px;height:18px}

/* ============ 본문 ============ */
main{padding:22px 0 60px}
.hello{display:flex;align-items:baseline;justify-content:space-between;gap:12px;margin-bottom:18px}
.hello h1{font-family:'Song Myung',serif;font-weight:400;font-size:22px}
.hello h1 b{color:var(--gold);font-weight:400}
.hello span{font-size:13px;color:var(--muted)}

.sec-title{display:flex;align-items:center;gap:8px;font-family:'Song Myung',serif;font-size:19px;margin:20px 0 10px;color:#f3e8d2}
.sec-title .more{margin-left:auto;font-family:'Noto Sans KR';font-size:13px;color:var(--muted)}
.sec-title::after{content:"";flex:0 0 0}
.sec-title.first{margin-top:16px}
.card{background:linear-gradient(180deg,var(--card),var(--ink-2));border:1px solid var(--line);border-radius:6px;position:relative}

/* 공지 (접기/펼치기) */
.notice{padding:0;overflow:hidden;border-color:rgba(201,55,42,.45)}
.notice summary{list-style:none;display:flex;align-items:center;gap:14px;padding:0 16px 0 0;cursor:pointer;min-height:56px}
.notice summary::-webkit-details-marker{display:none}
.notice .flag{flex:0 0 auto;align-self:stretch;width:72px;display:grid;place-items:center;
  background:linear-gradient(180deg,var(--red-2),var(--red));font-family:'Song Myung',serif;font-size:15px;letter-spacing:.15em;color:#fff}
.notice summary b{flex:1;min-width:0;font-size:16.5px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;padding:16px 0}
.notice .chev{flex:0 0 auto;width:10px;height:10px;border-right:2px solid var(--gold);border-bottom:2px solid var(--gold);
  transform:rotate(45deg) translateY(-3px);transition:transform .25s}
.notice[open] .chev{transform:rotate(-135deg) translateY(-3px)}
.notice[open] summary b{white-space:normal}
.notice .body{padding:14px 18px 16px 86px;border-top:1px solid rgba(201,55,42,.25);animation:open .25s ease}
.notice .body p{font-size:14.5px;color:#d8ccb4;line-height:1.65;white-space:pre-wrap}
.notice .body small{display:block;margin-top:8px;font-size:12px;color:var(--muted)}
@keyframes open{from{opacity:0;transform:translateY(-4px)}to{opacity:1;transform:none}}

/* 이번 주 일정 (가로 7칸) */
.week{display:grid;grid-template-columns:repeat(7,1fr);gap:8px;padding:14px}
.day{text-align:center;padding:12px 6px 14px;border-radius:8px;min-height:96px;transition:background .2s}
.day .dn{display:flex;flex-direction:column;align-items:center;gap:1px;margin-bottom:8px}
.day .dn b{font-family:'Song Myung',serif;font-size:19px;font-weight:400;color:#e9dcc0}
.day .dn span{font-size:11.5px;color:var(--muted)}
.day.sat .dn b{color:#8fa8d8}.day.sun .dn b{color:#e07a6e}
.day ul{list-style:none;display:flex;flex-direction:column;gap:5px}
.day li{font-size:12.5px;line-height:1.35;color:#d8ccb4}
.day li.war{color:#f08a7c;font-weight:500}
.day li.live{color:#9fb6e6}
.day.today{background:linear-gradient(180deg,rgba(216,178,106,.2),rgba(216,178,106,.06));box-shadow:inset 0 0 0 1.5px var(--gold)}
.day.today .dn b{color:var(--gold)}
.day.today .dn span::after{content:" · 오늘";color:var(--gold);font-weight:700}

/* 오늘의 이벤트 */
.events{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}
.ev{padding:16px;display:flex;flex-direction:column;gap:8px}
.ev .top{display:flex;align-items:center;gap:8px}
.ev .tag{font-size:11.5px;font-weight:700;padding:3px 8px;border-radius:3px;background:rgba(216,178,106,.15);color:var(--gold)}
.ev .tag.hot{background:var(--red);color:#fff}
.ev .left{margin-left:auto;font-size:12px;color:var(--muted)}
.ev b{font-size:16px}
.ev p{font-size:13.5px;color:#cfc2a8;line-height:1.5}
.ev .bar2{height:4px;border-radius:2px;background:rgba(239,228,207,.08);overflow:hidden;margin-top:auto}
.ev .bar2 i{display:block;height:100%;background:linear-gradient(90deg,var(--gold-2),var(--gold))}
.ev.hot .left{color:#f08a7c}
.ev .left{font-variant-numeric:tabular-nums}
.ev.hot .bar2 i{background:linear-gradient(90deg,var(--red),var(--red-2))}

.ev.extra{display:none}
.events.all .ev.extra{display:flex;animation:open .25s ease}
.more-btn{display:block;width:100%;margin-top:12px;padding:12px;border-radius:6px;border:1px dashed rgba(216,178,106,.45);
  background:rgba(216,178,106,.06);color:var(--gold);font-family:'Song Myung',serif;font-size:16px;letter-spacing:.1em;cursor:pointer}
.more-btn:hover{background:rgba(216,178,106,.12)}
[hidden]{display:none!important}
.empty{padding:18px;text-align:center;color:var(--muted);font-size:14px}
.notices{display:flex;flex-direction:column;gap:8px}
.soon{padding:60px 20px;text-align:center}
.soon img{width:64px;opacity:.9}
.soon h2{font-family:'Song Myung',serif;font-weight:400;font-size:22px;color:var(--gold);margin:14px 0 6px}
.soon p{color:var(--muted);font-size:14px}
footer{padding:10px 0 40px;text-align:center;font-size:12px;color:var(--muted)}
footer button{background:none;border:0;color:var(--muted);text-decoration:underline;cursor:pointer;font-size:12px;margin-left:8px}
.status{font-size:12px;color:var(--muted);text-align:right;margin-top:6px;min-height:16px}
/* 입장 문 열림 */
.gate{position:fixed;inset:0;z-index:50;pointer-events:none;display:flex}
.gate i{flex:1;background:linear-gradient(90deg,#0d0b09,#1c1712);transform:scaleX(1)}
.gate i:first-child{transform-origin:left;border-right:1px solid rgba(216,178,106,.5)}
.gate i:last-child{transform-origin:right;border-left:1px solid rgba(216,178,106,.5)}
.gate.open i{animation:gateOpen .7s cubic-bezier(.7,0,.3,1) .05s forwards}
@keyframes gateOpen{to{transform:scaleX(0)}}


/* ============ 로드맵 ============ */
.rm-head{display:flex;align-items:flex-end;justify-content:space-between;gap:12px;margin:16px 0 14px;flex-wrap:wrap}
.rm-head h2{font-family:'Song Myung',serif;font-weight:400;font-size:24px;color:#f3e8d2}
.rm-head p{font-size:13px;color:var(--muted);margin-top:4px}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chips button{border:1px solid rgba(216,178,106,.3);background:rgba(239,228,207,.04);color:#cdbf9f;padding:6px 13px;border-radius:99px;font-size:13px;cursor:pointer;font-family:inherit}
.chips button.on{background:var(--gold);border-color:var(--gold);color:#2a1a08;font-weight:700}
.timeline{position:relative;padding-left:30px}
.timeline::before{content:"";position:absolute;left:9px;top:8px;bottom:8px;width:2px;background:linear-gradient(180deg,var(--gold),rgba(216,178,106,.15))}
.period{position:relative;margin:0 0 22px}
.period>h3{position:relative;font-family:'Song Myung',serif;font-weight:400;font-size:19px;color:var(--gold);margin-bottom:10px;display:flex;align-items:center;gap:10px}
.period>h3::before{content:"";position:absolute;left:-27px;top:50%;width:14px;height:14px;margin-top:-7px;border-radius:50%;
  background:var(--ink);border:2px solid var(--gold);box-shadow:0 0 0 4px rgba(216,178,106,.12)}
.period.now>h3::before{background:var(--gold);box-shadow:0 0 0 5px rgba(216,178,106,.25),0 0 14px rgba(216,178,106,.6)}
.period>h3 small{font-family:'Noto Sans KR';font-size:12px;color:var(--muted)}
.period.now>h3 small{color:var(--muted)}
.items{display:grid;grid-template-columns:1fr;gap:8px}
.item{cursor:pointer;gap:4px;padding:14px 18px}
.item .meta{order:0}
.item .ttl{display:flex;align-items:center;gap:8px}
.item .ttl::after{content:"";margin-left:auto;flex:0 0 auto;width:8px;height:8px;border-right:2px solid var(--gold);border-bottom:2px solid var(--gold);transform:rotate(45deg) translateY(-3px);transition:transform .2s}
.item.open .ttl::after{transform:rotate(-135deg) translateY(-2px)}
.item .dl,.item .imgs{display:none}
.item.open .dl,.item.open .imgs{display:flex;animation:open .2s ease}
.item.open .imgs{display:grid}
.items{gap:8px}

.item{padding:14px 16px;display:flex;flex-direction:column;gap:6px}
.item .meta{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.cat{font-size:11.5px;font-weight:700;padding:2px 8px;border-radius:3px;background:rgba(216,178,106,.15);color:var(--gold)}
.cat.c-장수{background:rgba(201,55,42,.2);color:#f08a7c}
.cat.c-모드{background:rgba(111,143,208,.2);color:#9fb6e6}
.cat.c-이벤트{background:rgba(120,180,110,.18);color:#a6d39a}
.cat.c-시스템{background:rgba(239,228,207,.1);color:#d8ccb4}
.src{font-size:12px;color:var(--muted);margin-left:auto}
.item b{font-size:16px}
.item p{font-size:13.5px;color:#cfc2a8;line-height:1.55;white-space:pre-wrap}
.item.done{opacity:.55}
.item.done b{text-decoration:line-through;text-decoration-color:rgba(216,178,106,.6)}
.item .ttl{font-family:'Song Myung',serif;font-size:20px;line-height:1.3;color:#f6ecd8}
.dl{display:flex;flex-direction:column;gap:9px;margin-top:4px}
.dl div{border-left:3px solid var(--red-2);padding-left:11px}
.dl dt{font-size:12px;font-weight:700;color:var(--gold);letter-spacing:.03em}
.dl dd{font-size:14px;color:#e2d6bd;line-height:1.5;margin-top:1px}
.dl dd em{font-style:normal;color:#f08a7c;font-weight:700}
.imgs{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:8px;margin-top:6px}
.imgs img{width:100%;border-radius:6px;border:1px solid var(--line);display:block;cursor:zoom-in}
.zoom{position:fixed;inset:0;z-index:60;background:rgba(0,0,0,.88);display:flex;align-items:center;justify-content:center;padding:16px;cursor:zoom-out}
.zoom img{max-width:100%;max-height:100%;border-radius:6px}
.cat.c-상단대전{background:rgba(201,55,42,.2);color:#f08a7c}
.cat.c-장비{background:rgba(216,178,106,.18);color:var(--gold)}
.cat.c-콘텐츠{background:rgba(111,143,208,.2);color:#9fb6e6}
.cat.c-장수{background:rgba(214,120,170,.18);color:#e7a3c8}
.donebar{margin-top:6px}
.donebar summary{list-style:none;cursor:pointer;display:inline-flex;align-items:center;gap:8px;font-size:13.5px;color:var(--muted);padding:8px 12px;border:1px dashed rgba(216,178,106,.35);border-radius:6px}
.donebar summary::-webkit-details-marker{display:none}
.donebar .items{margin-top:10px}
@media (max-width:980px){
  .timeline{padding-left:24px}
  .timeline::before{left:6px}
  .period>h3{font-size:17px}
  .period>h3::before{left:-24px;width:12px;height:12px;margin-top:-6px}
  .rm-head h2{font-size:21px}
}

/* ============ 자유게시판 ============ */
.bd-head{display:flex;align-items:center;justify-content:space-between;gap:10px;margin:16px 0 12px}
.bd-head h2{font-family:'Song Myung',serif;font-weight:400;font-size:24px;color:#f3e8d2}
.btn-gold{display:inline-block;border:0;border-radius:6px;padding:10px 16px;font-family:'Song Myung',serif;font-size:15px;letter-spacing:.08em;color:#2a1a08;cursor:pointer;
  background:linear-gradient(180deg,#f0cf86,#d8a947 55%,#b8862f);box-shadow:inset 0 1px 0 rgba(255,255,255,.5)}
.btn-gold:disabled{filter:grayscale(.6) brightness(.8);cursor:default}
.btn-line{border:1px solid rgba(216,178,106,.4);background:rgba(239,228,207,.04);color:#cdbf9f;border-radius:6px;padding:9px 14px;font-size:14px;cursor:pointer;font-family:inherit}
.btn-line.danger{border-color:rgba(201,55,42,.5);color:#f08a7c}
.bd-bar{display:flex;gap:6px;margin-bottom:10px;flex-wrap:wrap;align-items:center}
.bd-bar button{border:1px solid rgba(216,178,106,.3);background:none;color:#cdbf9f;padding:6px 13px;border-radius:99px;font-size:13px;cursor:pointer;font-family:inherit}
.bd-bar button.on{background:var(--gold);border-color:var(--gold);color:#2a1a08;font-weight:700}
.bd-search{display:flex;gap:6px;margin-left:auto;flex:1;min-width:160px;max-width:280px}
.bd-search input{flex:1;min-width:0;padding:7px 12px;border-radius:99px;border:1px solid rgba(216,178,106,.3);background:rgba(239,228,207,.04);color:var(--paper);font-size:13px;font-family:inherit}
.posts{display:flex;flex-direction:column;overflow:hidden}
.post{display:flex;gap:14px;align-items:center;padding:14px 16px;border-bottom:1px solid var(--line);cursor:pointer;color:inherit}
.post:last-child{border-bottom:0}
.post:hover{background:rgba(216,178,106,.05)}
.post .pb{flex:1;min-width:0}
.post .t{display:flex;align-items:center;gap:8px;font-size:16px;font-weight:700}
.post .t span.tt{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}
.post .cmt{color:var(--red-2);font-size:13px;font-weight:700;flex:0 0 auto}
.post .ex{font-size:13.5px;color:#bfb196;margin-top:3px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.post .by{font-size:12px;color:var(--muted);margin-top:5px}
.post .by b{color:#d8ccb4;font-weight:500}
.post .thumb{flex:0 0 auto;width:68px;height:68px;border-radius:6px;object-fit:cover;border:1px solid var(--line);background:#000}
.badge{flex:0 0 auto;font-size:11px;font-weight:700;padding:2px 7px;border-radius:3px}
.badge.pin{background:var(--red);color:#fff}
.badge.c-자유{background:rgba(239,228,207,.1);color:#d8ccb4}
.badge.c-질문{background:rgba(111,143,208,.2);color:#9fb6e6}
.badge.c-자랑{background:rgba(216,178,106,.18);color:var(--gold)}
.post.pinned{background:rgba(163,36,28,.08)}
.dot{width:6px;height:6px;border-radius:50%;background:var(--red-2);flex:0 0 auto}
.pager{display:flex;justify-content:center;gap:4px;margin-top:14px;flex-wrap:wrap}
.pager button{min-width:36px;height:36px;border-radius:6px;border:1px solid rgba(216,178,106,.25);background:rgba(239,228,207,.03);color:#cdbf9f;font-size:14px;cursor:pointer;font-family:inherit}
.pager button.on{background:var(--gold);border-color:var(--gold);color:#2a1a08;font-weight:700}
.pager button:disabled{opacity:.35;cursor:default}
.bd-msg{padding:28px 16px;text-align:center;color:var(--muted);font-size:14px}
/* 글 보기 */
.back{display:inline-flex;align-items:center;gap:6px;color:var(--muted);font-size:14px;margin:14px 0 10px;cursor:pointer;background:none;border:0;font-family:inherit;padding:4px 0}
.view{padding:20px 22px}
.view h1{font-size:22px;line-height:1.35;margin:8px 0 6px;word-break:break-word}
.view .by{font-size:13px;color:var(--muted);display:flex;gap:10px;flex-wrap:wrap;padding-bottom:14px;border-bottom:1px solid var(--line)}
.view .by b{color:var(--gold);font-weight:500}
.view .txt{font-size:15.5px;line-height:1.75;color:#e9dec6;white-space:pre-wrap;word-break:break-word;margin:16px 0}
.view .photos{display:flex;flex-direction:column;gap:10px;max-width:760px}
.view .photos img{width:100%;border-radius:6px;border:1px solid var(--line);display:block;cursor:zoom-in;background:#000}
.acts{display:flex;gap:6px;justify-content:flex-end;margin-top:16px;padding-top:14px;border-top:1px solid var(--line)}
.comments h3{font-family:'Song Myung',serif;font-weight:400;font-size:18px;color:#f3e8d2;margin:20px 0 6px}
.cm{padding:12px 0;border-bottom:1px solid var(--line)}
.cm .who{font-size:13px;color:var(--muted);display:flex;align-items:center;gap:8px}
.cm .who b{color:#d8ccb4;font-weight:700}
.cm .who b.op{color:var(--gold)}
.cm .who button{margin-left:auto;background:none;border:0;color:var(--muted);font-size:12px;text-decoration:underline;cursor:pointer;font-family:inherit}
.cm p{font-size:14.5px;color:#e2d6bd;margin-top:4px;line-height:1.55;white-space:pre-wrap;word-break:break-word}
.cm-form{display:flex;gap:8px;margin-top:12px}
.cm-form input{flex:1;min-width:0;padding:11px 12px;border-radius:6px;border:1px solid rgba(216,178,106,.3);background:rgba(239,228,207,.04);color:var(--paper);font-size:14.5px;font-family:inherit}
/* 글쓰기 */
.write{padding:20px 22px;display:flex;flex-direction:column;gap:14px}
.write h2{font-family:'Song Myung',serif;font-weight:400;font-size:20px;color:#f3e8d2}
.write label.l{font-size:12.5px;color:var(--muted);display:block;margin-bottom:6px}
.write input[type=text],.write textarea{width:100%;padding:11px 12px;border-radius:6px;border:1px solid rgba(216,178,106,.3);background:rgba(239,228,207,.04);color:var(--paper);font-size:15px;font-family:inherit}
.write textarea{min-height:200px;resize:vertical;line-height:1.6}
.cats{display:flex;gap:6px;flex-wrap:wrap}
.cats button{border:1px solid rgba(216,178,106,.3);background:none;color:#cdbf9f;padding:7px 16px;border-radius:99px;font-size:13.5px;cursor:pointer;font-family:inherit}
.cats button.on{background:var(--gold);color:#2a1a08;border-color:var(--gold);font-weight:700}
.up{display:flex;gap:10px;flex-wrap:wrap}
.up .add{width:84px;height:84px;border-radius:6px;border:1px dashed rgba(216,178,106,.5);display:grid;place-items:center;align-content:center;color:var(--gold);font-size:12px;text-align:center;line-height:1.4;cursor:pointer}
.up .add b{display:block;font-size:24px;font-weight:400}
.up .ph{position:relative;width:84px;height:84px}
.up .ph img{width:100%;height:100%;object-fit:cover;border-radius:6px;border:1px solid var(--line)}
.up .ph button{position:absolute;top:-7px;right:-7px;width:24px;height:24px;border-radius:50%;background:#000;border:1px solid var(--gold);color:var(--gold);font-size:13px;display:grid;place-items:center;cursor:pointer;padding:0}

<script>
/* =========================================================
   설정 (로그인 화면 index.html 과 같은 주소)
   ========================================================= */
const SCRIPT_URL = 'https://script.google.com/macros/s/AKfycby50UXAep9TnS_pUEouvTqDp2AD2XUoiE9DfoyGrw0TNyGfc4P5sinCxW9OlqN0PTp_kQ/exec';
const SHOW_EVENTS = 6;        // 오늘의 이벤트 기본 표시 개수
const MAX_NOTICES = 3;        // 공지 최대 표시 개수
const REFRESH_MIN = 5;        // 열어둔 동안 자동 새로고침 간격(분)

const AUTH = 'imjoban_auth', CACHE = 'imjoban_cache';
const $ = id => document.getElementById(id);
const DAYS = ['일','월','화','수','목','금','토'];
function get(k){ try{ return JSON.parse(localStorage.getItem(k)); }catch(e){ return null; } }
function put(k,v){ try{ v==null ? localStorage.removeItem(k) : localStorage.setItem(k, JSON.stringify(v)); }catch(e){} }

const auth = get(AUTH);
if (!auth || !auth.nick) location.replace('./');

/* 입장 문 열림 연출 (로그인 화면에서 넘어온 경우) */
(function(){ const g=$('gate');
  try{ if (sessionStorage.getItem('imjoban_gate')){ sessionStorage.removeItem('imjoban_gate'); g.classList.add('open'); setTimeout(()=>g.remove(),900); return; } }catch(e){}
  g.remove(); })();

$('who').textContent = (auth && auth.nick ? auth.nick + '님' : '');
$('logout').onclick = () => { put(AUTH,null); put(CACHE,null); location.replace('./'); };

/* ---------- 날짜 도구 (게임 하루: 오전 9시 ~ 다음날 오전 8시 59분) ---------- */
function gameToday(){ const d=new Date(); if(d.getHours()<9) d.setDate(d.getDate()-1); d.setHours(0,0,0,0); return d; }
function parseWhen(v, defHour){
  v = String(v||'').trim(); if(!v) return null;
  let m = v.match(/^(\d{4})[-./](\d{1,2})[-./](\d{1,2})(?:[ T](\d{1,2}):(\d{2}))?/);
  let y, mo, d, h=null, mi=0;
  if (m){ y=+m[1]; mo=+m[2]; d=+m[3]; if(m[4]!=null){ h=+m[4]; mi=+m[5]; } }
  else if ((m = v.match(/^(\d{1,2})[-./](\d{1,2})(?:\s+(\d{1,2}):(\d{2}))?$/))){
    y=gameToday().getFullYear(); mo=+m[1]; d=+m[2]; if(m[3]!=null){ h=+m[3]; mi=+m[4]; } }
  else return null;
  return new Date(y, mo-1, d, h==null?defHour:h, mi).getTime();
}
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));

/* ---------- 공지 ---------- */
function renderNotices(list){
  const box=$('notices');
  list=(list||[]).filter(n=>String(n['제목']||'').trim()).slice(0,MAX_NOTICES);
  if(!list.length){ box.innerHTML='<div class="card empty">등록된 공지가 없어요</div>'; return; }
  box.innerHTML=list.map(n=>`<details class="card notice">
    <summary><span class="flag">공지</span><b>${esc(n['제목'])}</b><i class="chev" aria-hidden="true"></i></summary>
    <div class="body">${n['내용']?`<p>${esc(n['내용'])}</p>`:''}${n['작성일']?`<small>${esc(n['작성일'])}</small>`:''}</div>
  </details>`).join('');
}

/* ---------- 이번 주 일정 ---------- */
function renderWeek(rows){
  const t=gameToday(), mon=new Date(t); mon.setDate(t.getDate()-((t.getDay()+6)%7));
  const by={}; (rows||[]).forEach(r=>{ const k=String(r['요일']||'').trim().charAt(0); if(!k||!r['내용']) return; (by[k]=by[k]||[]).push(r); });
  let html='';
  for(let i=0;i<7;i++){
    const d=new Date(mon); d.setDate(mon.getDate()+i); const dn=DAYS[d.getDay()];
    const cls=['day', d.getDay()===6?'sat':'', d.getDay()===0?'sun':'', +d===+t?'today':''].join(' ');
    html+=`<div class="${cls}"><div class="dn"><b>${dn}</b><span>${d.getMonth()+1}/${d.getDate()}</span></div><ul>`+
      (by[dn]||[]).map(r=>{ const g=String(r['구분']||''); const c=/상단전|전쟁|길드전/.test(g)?'war':/라방|방송/.test(g)?'live':''; return `<li class="${c}">${esc(r['내용'])}</li>`; }).join('')+'</ul></div>';
  }
  $('week').innerHTML=html;
}

/* ---------- 오늘의 이벤트 ---------- */
let EVENTS=[];
function left(ms){
  if(ms<=0) return '종료';
  const s=Math.floor(ms/1000), d=Math.floor(s/86400), h=Math.floor(s%86400/3600), m=Math.floor(s%3600/60);
  if(!d && !h && !m) return '1분 미만';
  return (d?d+'일 ':'')+(d||h?h+'시간 ':'')+m+'분';
}
function dtag(end){ const n=Math.ceil((end-Date.now())/864e5)-1; return n<=0?'오늘 마감':'D-'+n; }
const evBox=$('events'), mb=$('moreBtn');
function renderEvents(rows){
  const now=Date.now();
  EVENTS=(rows||[]).map(r=>({title:r['제목'],desc:r['내용'],start:parseWhen(r['시작'],9),end:parseWhen(r['종료'],8)}))
    .filter(e=>e.title && e.end && e.end>now && (!e.start || e.start<=now)).sort((a,b)=>a.end-b.end);
  if(!EVENTS.length){ evBox.innerHTML='<div class="card empty" style="grid-column:1/-1">진행 중인 이벤트가 없어요</div>'; mb.hidden=true; return; }
  evBox.innerHTML=EVENTS.map((e,i)=>{ const hot=dtag(e.end)==='오늘 마감';
    return `<div class="card ev${hot?' hot':''}${i>=SHOW_EVENTS?' extra':''}" data-start="${e.start||''}" data-end="${e.end}">
      <div class="top"><span class="tag${hot?' hot':''}">${dtag(e.end)}</span><span class="left"></span></div>
      <b>${esc(e.title)}</b>${e.desc?`<p>${esc(e.desc)}</p>`:'<p></p>'}<div class="bar2"><i></i></div></div>`; }).join('');
  mb.hidden=EVENTS.length<=SHOW_EVENTS; mb.textContent=evBox.classList.contains('all')?'– 접기':'+ 더보기';
  tick();
}
function tick(){
  const now=Date.now();
  evBox.querySelectorAll('.ev').forEach(el=>{
    const st=+el.dataset.start||0, en=+el.dataset.end;
    el.querySelector('.left').textContent=left(en-now);
    el.querySelector('.bar2 i').style.width=(st?Math.min(100,Math.max(0,(now-st)/(en-st)*100)):0)+'%';
  });
}
setInterval(tick,15000);
evBox.addEventListener('click',e=>{const el=e.target.closest('.ev'); if(el && matchMedia('(max-width:980px)').matches) el.classList.toggle('open');});
mb.onclick=()=>{const o=evBox.classList.toggle('all');mb.textContent=o?'– 접기':'+ 더보기';};


/* ---------- 로드맵 ---------- */
/* 내용: 한 줄에 "라벨: 값" → 카드뉴스처럼 표시 / 숫자 변화(→)는 강조 */
function details(t){
  const lines=String(t||'').split(/\n+/).map(x=>x.trim()).filter(Boolean);
  if(!lines.length) return '';
  return '<dl class="dl">'+lines.map(l=>{
    const m=l.match(/^([^:：]{1,20})[:：]\s*(.*)$/);
    const hi=v=>esc(v).replace(/(\d[\d.,%~]*\s*(?:초|%|명|레벨|성)?\s*→\s*\d[\d.,%]*\s*(?:초|%|명|레벨|성)?)/g,'<em>$1</em>');
    return m?`<div><dt>${esc(m[1])}</dt><dd>${hi(m[2]).split(' · ').join('<br>')}</dd></div>`:`<div><dd>${hi(l)}</dd></div>`;
  }).join('')+'</dl>';
}
/* 이미지: 주소를 줄바꿈이나 쉼표로 여러 개. 구글 드라이브 공유 링크도 가능 */
function imgUrl(u){
  u=u.trim(); const m=u.match(/drive\.google\.com\/(?:file\/d\/|open\?id=|uc\?.*id=)([\w-]{20,})/);
  return m?`https://drive.google.com/thumbnail?id=${m[1]}&sz=w1200`:u;
}
function images(t){
  const urls=String(t||'').split(/[\n,]+/).map(x=>x.trim()).filter(x=>/^https?:\/\//.test(x)||/^[\w./-]+\.(jpe?g|png|webp|gif)$/i.test(x));
  return urls.length?'<div class="imgs">'+urls.map(u=>`<img src="${esc(imgUrl(u))}" alt="" loading="lazy">`).join('')+'</div>':'';
}
document.addEventListener('click',e=>{
  const im=e.target.closest('.imgs img'); if(!im) return;
  const z=document.createElement('div'); z.className='zoom'; const i=document.createElement('img'); i.src=im.src; z.appendChild(i);
  z.onclick=()=>z.remove(); document.body.appendChild(z);
});

let RM=[], RM_CAT='전체';
function renderRoadmap(rows){
  RM=(rows||[]).filter(r=>String(r['제목']||'').trim());
  const cats=['전체',...new Set(RM.map(r=>r['분류']).filter(Boolean))];
  $('rmChips').innerHTML=cats.map(c=>`<button data-c="${esc(c)}" class="${c===RM_CAT?'on':''}">${esc(c)}</button>`).join('');
  const show=RM.filter(r=>RM_CAT==='전체'||r['분류']===RM_CAT);
  const todo=show.filter(r=>!/적용|완료/.test(r['상태']||'')), done=[];   // 적용된 항목은 표시하지 않음
  const groups=[]; const idx={};
  todo.forEach(r=>{const k=String(r['시기']||'미정').trim()||'미정'; if(!(k in idx)){idx[k]=groups.length;groups.push({k,list:[]});} groups[idx[k]].list.push(r);});
  const card=(r,d)=>`<div class="card item${d?' done':''}"><div class="meta">${r['분류']?`<span class="cat c-${esc(r['분류'])}">${esc(r['분류'])}</span>`:''}${r['발표']?`<span class="src">${esc(r['발표'])}</span>`:''}</div><b class="ttl">${esc(r['제목'])}</b>${details(r['내용'])}${images(r['이미지'])}</div>`;
  $('rmList').innerHTML=groups.length?groups.map((g,i)=>`<div class="period${i===0?' now':''}"><h3>${esc(g.k)} <small>${g.list.length}개</small></h3><div class="items">${g.list.map(r=>card(r)).join('')}</div></div>`).join('')
    :'<div class="card empty">예정된 업데이트가 없어요</div>';
  $('rmDone').hidden=!done.length;
  $('rmDone').querySelector('summary').textContent=`✔ 적용 완료된 항목 보기 (${done.length})`;
  $('rmDoneList').innerHTML=done.map(r=>card(r,true)).join('');
}
$('rmChips').addEventListener('click',e=>{const b=e.target.closest('button'); if(!b) return; RM_CAT=b.dataset.c; renderRoadmap(RM_ALL);});
let RM_ALL=[];
document.addEventListener('click',e=>{ if(e.target.closest('.imgs img')) return; const it=e.target.closest('.item'); if(it) it.classList.toggle('open'); });

/* ---------- 데이터 불러오기 (저장된 내용 먼저, 최신은 뒤에서) ---------- */
function renderAll(d){ renderNotices(d.notices); renderWeek(d.weekly); RM_ALL=d.roadmap||[]; renderRoadmap(RM_ALL); }
async function load(silent){
  for(let i=0;i<3;i++){
    try{
      const res=await fetch(SCRIPT_URL,{method:'POST',body:JSON.stringify({nick:auth.nick,pw:auth.pw})});
      const r=await res.json();
      if(!r.ok){ if(r.code==='bad_pw'||r.code==='blocked'){ put(AUTH,null); put(CACHE,null); location.replace('./'); } return; }
      put(CACHE,{at:Date.now(),data:r.data}); renderAll(r.data); $('status').textContent=''; return;
    }catch(e){ await new Promise(ok=>setTimeout(ok,700*(i+1))); }
  }
  if(!silent) $('status').textContent='연결이 원활하지 않아 마지막으로 불러온 내용을 보여주고 있어요.';
}
const cached=get(CACHE);
if(cached && cached.data) renderAll(cached.data); else renderWeek([]);
if(auth) load();
setInterval(()=>{ if(!document.hidden) load(true); }, REFRESH_MIN*60000);

/* ---------- 자유게시판 ---------- */
const BKEY='imjoban_board_key';
function boardKey(){
  let k=get(BKEY);
  if(typeof k!=='string'||k.length<32){ k=Array.from(crypto.getRandomValues(new Uint8Array(24)),b=>b.toString(16).padStart(2,'0')).join(''); put(BKEY,k); }
  return k;
}
async function api(action, body){
  let lastErr;
  for(let i=0;i<2;i++){
    try{
      const res=await fetch(SCRIPT_URL,{method:'POST',body:JSON.stringify(Object.assign({nick:auth.nick,pw:auth.pw,action,key:boardKey()},body||{}))});
      const r=await res.json();
      if(r.code==='bad_pw'||r.code==='blocked'){ put(AUTH,null); put(CACHE,null); location.replace('./'); }
      return r;
    }catch(e){ lastErr=e; await new Promise(ok=>setTimeout(ok,800)); }
  }
  return {ok:false,error:'연결이 원활하지 않아요. 잠시 후 다시 시도해주세요.'};
}
function toast(msg){ const t=document.createElement('div'); t.className='toast'; t.textContent=msg; document.body.appendChild(t); setTimeout(()=>t.remove(),2400); }
function ago(iso){
  const d=new Date(iso); if(isNaN(d)) return '';
  const s=(Date.now()-d)/1000;
  if(s<60) return '방금'; if(s<3600) return Math.floor(s/60)+'분 전'; if(s<86400) return Math.floor(s/3600)+'시간 전';
  if(s<172800) return '어제';
  return (d.getMonth()+1)+'/'+d.getDate();
}
function fullTime(iso){ const d=new Date(iso); if(isNaN(d)) return ''; const h=d.getHours();
  return (d.getMonth()+1)+'/'+d.getDate()+' '+(h<12?'오전 ':'오후 ')+((h%12)||12)+':'+String(d.getMinutes()).padStart(2,'0'); }
const BD={cat:'',q:'',page:1};
let bdSeq=0;

async function bdLoadList(){
  const my=++bdSeq;
  $('bdPosts').innerHTML='<div class="bd-msg">불러오는 중…</div>';
  const r=await api('board_list',{cat:BD.cat,q:BD.q,page:BD.page});
  if(my!==bdSeq) return;
  if(!r.ok){ $('bdPosts').innerHTML=`<div class="bd-msg">${esc(r.error||'불러오지 못했어요')}</div>`; $('bdPager').innerHTML=''; return; }
  if(!Array.isArray(r.posts)){ $('bdPosts').innerHTML='<div class="bd-msg">게시판을 준비하고 있어요. 조금만 기다려주세요!</div>'; $('bdPager').innerHTML=''; return; }
  BD.page=r.page;
  const row=(p,pin)=>`<a class="post${pin?' pinned':''}" href="#board/${p.id}"><div class="pb">
      <div class="t">${pin?'<span class="badge pin">공지</span>':`<span class="badge c-${esc(p.cat)}">${esc(p.cat)}</span>`}<span class="tt">${esc(p.title)}</span>${p.comments?`<span class="cmt">[${p.comments}]</span>`:''}${(Date.now()-new Date(p.at))<86400000?'<i class="dot" title="새 글"></i>':''}</div>
      ${pin||!p.excerpt?'':`<div class="ex">${esc(p.excerpt)}</div>`}
      <div class="by"><b>${esc(p.author)}</b> · ${ago(p.at)}</div></div>
      ${p.thumb?`<img class="thumb" src="${esc(p.thumb)}" alt="" loading="lazy">`:''}</a>`;
  const html=(r.pinned||[]).map(p=>row(p,true)).join('')+r.posts.map(p=>row(p,false)).join('');
  $('bdPosts').innerHTML=html||`<div class="bd-msg">${BD.q?'검색 결과가 없어요':'아직 글이 없어요. 첫 글을 남겨보세요!'}</div>`;
  // 페이지
  const P=r.pages, cur=r.page; let pg='';
  if(P>1){
    const from=Math.max(1,Math.min(cur-2,P-4)), to=Math.min(P,from+4);
    pg+=`<button data-p="${cur-1}" ${cur<=1?'disabled':''} aria-label="이전 페이지">‹</button>`;
    for(let i=from;i<=to;i++) pg+=`<button data-p="${i}" class="${i===cur?'on':''}">${i}</button>`;
    pg+=`<button data-p="${cur+1}" ${cur>=P?'disabled':''} aria-label="다음 페이지">›</button>`;
  }
  $('bdPager').innerHTML=pg;
}
$('bdPager').addEventListener('click',e=>{const b=e.target.closest('button[data-p]'); if(!b||b.disabled) return; BD.page=+b.dataset.p; bdLoadList(); scrollTo(0,0);});
document.querySelector('.bd-bar').addEventListener('click',e=>{const b=e.target.closest('button[data-cat]'); if(!b) return;
  document.querySelectorAll('.bd-bar button[data-cat]').forEach(x=>x.classList.toggle('on',x===b)); BD.cat=b.dataset.cat; BD.page=1; bdLoadList();});
$('bdSearch').addEventListener('submit',e=>{e.preventDefault(); BD.q=$('bdQ').value.trim(); BD.page=1; bdLoadList();});

let VIEW=null;
async function bdShowPost(id){
  const box=$('bdView'); box.innerHTML='<button class="back" type="button" onclick="location.hash=\'#board\'">‹ 목록으로</button><div class="card bd-msg">불러오는 중…</div>';
  const r=await api('board_get',{id});
  if(!r.ok){ box.innerHTML='<button class="back" type="button" onclick="location.hash=\'#board\'">‹ 목록으로</button><div class="card bd-msg">'+esc(r.error||'불러오지 못했어요')+'</div>'; return; }
  const p=VIEW=r.post;
  box.innerHTML=`<button class="back" type="button" onclick="location.hash='#board'">‹ 목록으로</button>
  <article class="card view">
    <span class="badge ${p.pinned?'pin':'c-'+esc(p.cat)}">${p.pinned?'공지':esc(p.cat)}</span>
    <h1>${esc(p.title)}</h1>
    <div class="by"><span><b>${esc(p.author)}</b></span><span>${fullTime(p.at)}</span></div>
    ${p.body?`<div class="txt">${esc(p.body)}</div>`:'<div style="height:14px"></div>'}
    ${p.photos.length?`<div class="photos">${p.photos.map(ph=>`<img src="${esc(ph.url)}" alt="첨부 사진" loading="lazy">`).join('')}</div>`:''}
    ${p.mine?`<div class="acts"><a class="btn-line" href="#board/edit/${p.id}">수정</a><button class="btn-line danger" type="button" id="bdDel">삭제</button></div>`:''}
    <section class="comments">
      <h3>댓글 ${p.commentList.length}</h3>
      ${p.commentList.map(c=>`<div class="cm"><div class="who"><b class="${c.author===p.author?'op':''}">${esc(c.author)}${c.author===p.author?' (글쓴이)':''}</b>${ago(c.at)}${c.mine?`<button type="button" data-cdel="${c.id}">삭제</button>`:''}</div><p>${esc(c.body)}</p></div>`).join('')}
      <form class="cm-form" id="cmForm"><input id="cmBody" maxlength="500" placeholder="댓글을 입력하세요" aria-label="댓글"><button class="btn-gold" id="cmBtn">등록</button></form>
    </section>
  </article>`;
  const del=$('bdDel'); if(del) del.onclick=async()=>{ if(!confirm('이 글을 삭제할까요? 사진도 함께 삭제됩니다.')) return; del.disabled=true;
    const r2=await api('board_delete',{id:p.id}); if(r2.ok){ toast('삭제했어요'); location.hash='#board'; } else { del.disabled=false; toast(r2.error); } };
  $('cmForm').onsubmit=async e=>{ e.preventDefault(); const body=$('cmBody').value.trim(); if(!body) return; $('cmBtn').disabled=true;
    const r2=await api('comment_add',{postId:p.id,body}); $('cmBtn').disabled=false; if(r2.ok) bdShowPost(p.id); else toast(r2.error); };
  box.querySelectorAll('[data-cdel]').forEach(b=>b.onclick=async()=>{ if(!confirm('댓글을 삭제할까요?')) return;
    const r2=await api('comment_delete',{id:+b.dataset.cdel}); if(r2.ok) bdShowPost(p.id); else toast(r2.error); });
}

/* 글쓰기 · 수정 */
let FORM={id:null,cat:'자유',keep:[],add:[]};
function bdRenderPhotos(){
  const n=FORM.keep.length+FORM.add.length;
  $('bdPhotos').innerHTML=FORM.keep.map((ph,i)=>`<div class="ph"><img src="${esc(ph.url)}" alt=""><button type="button" data-k="${i}" aria-label="사진 빼기">×</button></div>`).join('')+
    FORM.add.map((d,i)=>`<div class="ph"><img src="${d}" alt=""><button type="button" data-a="${i}" aria-label="사진 빼기">×</button></div>`).join('')+
    (n<5?'<label class="add" for="bdFile"><span><b>+</b>사진 추가</span></label>':'');
}
$('bdPhotos').addEventListener('click',e=>{const b=e.target.closest('button'); if(!b) return;
  if(b.dataset.k!=null) FORM.keep.splice(+b.dataset.k,1); else FORM.add.splice(+b.dataset.a,1); bdRenderPhotos();});
async function shrink(file){
  const url=URL.createObjectURL(file);
  try{
    const img=await new Promise((ok,no)=>{const i=new Image(); i.onload=()=>ok(i); i.onerror=no; i.src=url;});
    const max=1600, sc=Math.min(1,max/Math.max(img.width,img.height));
    const c=document.createElement('canvas'); c.width=Math.round(img.width*sc); c.height=Math.round(img.height*sc);
    c.getContext('2d').drawImage(img,0,0,c.width,c.height);
    let q=.82, d=c.toDataURL('image/jpeg',q);
    while(d.length>600000 && q>.5){ q-=.1; d=c.toDataURL('image/jpeg',q); }
    return d;
  } finally { URL.revokeObjectURL(url); }
}
$('bdFile').addEventListener('change',async e=>{
  const files=[...e.target.files].filter(f=>/^image\//.test(f.type)); e.target.value='';
  for(const f of files){ if(FORM.keep.length+FORM.add.length>=5){ toast('사진은 최대 5장까지예요'); break; }
    try{ FORM.add.push(await shrink(f)); bdRenderPhotos(); }catch(err){ toast('이 사진은 올릴 수 없어요'); } }
});
$('bdCats').addEventListener('click',e=>{const b=e.target.closest('button'); if(!b) return; FORM.cat=b.dataset.cat;
  $('bdCats').querySelectorAll('button').forEach(x=>x.classList.toggle('on',x===b));});
function bdOpenForm(post){
  FORM={id:post?post.id:null,cat:post?post.cat:'자유',keep:post?post.photos.slice():[],add:[]};
  $('bdFormTitle').textContent=post?'글 수정':'글쓰기';
  $('bdSubmit').textContent=post?'수정하기':'등록하기';
  $('bdTitle').value=post?post.title:''; $('bdBody').value=post?post.body:''; $('bdErr').textContent='';
  $('bdCats').querySelectorAll('button').forEach(x=>x.classList.toggle('on',x.dataset.cat===FORM.cat));
  bdRenderPhotos();
}
const bdBack=()=>{ location.hash = FORM.id ? '#board/'+FORM.id : '#board'; };
$('bdCancel').onclick=bdBack; $('bdCancel2').onclick=bdBack;
$('bdForm').addEventListener('submit',async e=>{
  e.preventDefault();
  const title=$('bdTitle').value.trim(), body=$('bdBody').value.trim();
  if(!title){ $('bdErr').textContent='제목을 입력해주세요.'; $('bdTitle').focus(); return; }
  if(!body && !FORM.keep.length && !FORM.add.length){ $('bdErr').textContent='내용을 입력해주세요.'; $('bdBody').focus(); return; }
  const btn=$('bdSubmit'), label=btn.textContent; btn.disabled=true; btn.textContent=FORM.add.length?'사진 올리는 중…':'저장 중…'; $('bdErr').textContent='';
  const payload={cat:FORM.cat,title,body,photos:FORM.add.map(d=>({data:d}))};
  const r=FORM.id ? await api('board_edit',Object.assign(payload,{id:FORM.id,keep:FORM.keep.map(p=>p.id)})) : await api('board_write',payload);
  btn.disabled=false; btn.textContent=label;
  if(!r.ok){ $('bdErr').textContent=r.error||'저장하지 못했어요.'; return; }
  if(r.photoFailed) toast('일부 사진을 올리지 못했어요');
  else toast(FORM.id?'수정했어요':'등록했어요');
  BD.page=1; location.hash='#board/'+r.id;
});

/* 게시판 화면 전환: #board, #board/12, #board/write, #board/edit/12 */
async function boardRoute(parts){
  const v=parts[1], show=k=>['List','View','Write'].forEach(x=>$('bd'+x).hidden=(x!==k));
  if(!v){ show('List'); bdLoadList(); }
  else if(v==='write'){ show('Write'); bdOpenForm(null); }
  else if(v==='edit'){ const id=+parts[2]; show('Write');
    if(!VIEW||VIEW.id!==id){ const r=await api('board_get',{id}); VIEW=r.ok?r.post:null; }
    if(!VIEW||!VIEW.mine){ toast('처음 쓴 기기에서만 수정할 수 있어요'); location.hash='#board/'+id; return; }
    bdOpenForm(VIEW); }
  else { show('View'); bdShowPost(+v); }
}
document.addEventListener('click',e=>{
  const im=e.target.closest('.view .photos img'); if(!im) return;
  const z=document.createElement('div'); z.className='zoom'; const i=document.createElement('img'); i.src=im.src; z.appendChild(i);
  z.onclick=()=>z.remove(); document.body.appendChild(z);
});

/* ---------- 탭 ---------- */
const TAB_NAMES={board:'자유게시판',guide:'초보자 가이드',strategy:'공략집',roadmap:'로드맵'};
const READY={roadmap:'tab-roadmap',board:'tab-board'};
function showTab(){
  const parts=(location.hash||'#home').slice(1).split('/'), t=parts[0];
  document.querySelectorAll('nav.menu a').forEach(a=>a.classList.toggle('on',a.dataset.tab===t||(!TAB_NAMES[t]&&a.dataset.tab==='home')));
  const home=!TAB_NAMES[t]; $('tab-home').hidden=!home;
  Object.values(READY).forEach(id=>$(id).hidden=true);
  if(READY[t]){ $(READY[t]).hidden=false; $('tab-soon').hidden=true; }
  else { $('tab-soon').hidden=home; if(!home) $('soonTitle').textContent=TAB_NAMES[t]; }
  if(t==='board') boardRoute(parts);
  scrollTo(0,0);
}
addEventListener('hashchange',showTab); showTab();

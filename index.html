<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>KOREADEER 상단 · 임조반</title>
<meta name="description" content="임진왜란 조선의 반격 · KOREADEER 상단 공략 · 일정 · 라방 로드맵">
<meta name="theme-color" content="#0d0b09">
<meta property="og:title" content="KOREADEER 상단 · 임조반">
<meta property="og:description" content="공략 · 일정 · 라방 로드맵">
<meta property="og:image" content="icon/icon-512.png">
<link rel="icon" href="icon/favicon.ico" sizes="any">
<link rel="icon" type="image/png" sizes="32x32" href="icon/favicon-32.png">
<link rel="apple-touch-icon" href="icon/apple-touch-icon.png">
<link rel="manifest" href="manifest.json">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Dokdo&family=Song+Myung&family=Noto+Sans+KR:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{
  --ink:#0d0b09; --ink-2:#1a1612; --paper:#efe4cf; --muted:#b5a68c;
  --gold:#d8b26a; --gold-2:#a8823f; --red:#a3241c; --red-2:#c9372a;
  --ease:cubic-bezier(.2,.7,.2,1);
}
*{box-sizing:border-box;margin:0;padding:0}
[hidden]{display:none!important}
html,body{height:100%;background:var(--ink);overflow:hidden}
body{font-family:'Noto Sans KR',system-ui,sans-serif;color:var(--paper);-webkit-font-smoothing:antialiased;
  -webkit-tap-highlight-color:transparent}
button,input{font:inherit;color:inherit}

/* ================= 배경 무대 ================= */
#stage{position:fixed;inset:0;overflow:hidden;background:var(--ink)}
.bg{position:absolute;inset:-4%;opacity:0;animation:bgIn 1.6s var(--ease) .1s forwards}
.bg img,.bg video{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.bg img{object-position:38% 30%;filter:brightness(.62) saturate(.9);animation:kenburns 24s ease-in-out infinite alternate}
.bg video{filter:brightness(.75)}
.bg video{opacity:0;transition:opacity 1.2s}
.bg video.ready{opacity:1}
@keyframes bgIn{to{opacity:1}}
@keyframes kenburns{from{transform:scale(1.04) translate(0,0)}to{transform:scale(1.16) translate(-2%,-1.5%)}}

/* 연기 */
.smoke{position:absolute;inset:-20%;pointer-events:none;mix-blend-mode:screen;opacity:.35;
  background:
    radial-gradient(40% 30% at 20% 80%,rgba(200,170,130,.35),transparent 70%),
    radial-gradient(35% 25% at 80% 70%,rgba(180,140,100,.3),transparent 70%),
    radial-gradient(30% 20% at 50% 95%,rgba(220,190,150,.25),transparent 70%);
  animation:drift 18s ease-in-out infinite alternate}
.smoke.s2{opacity:.22;animation-duration:26s;animation-direction:alternate-reverse;transform:scale(1.2)}
@keyframes drift{from{transform:translate3d(-4%,2%,0) scale(1)}to{transform:translate3d(4%,-3%,0) scale(1.1)}}

#embers{position:absolute;inset:0;width:100%;height:100%;pointer-events:none}
.vignette{position:absolute;inset:0;pointer-events:none;
  background:
    radial-gradient(60% 45% at 50% 32%,rgba(8,6,4,.55),transparent 75%),
    radial-gradient(120% 80% at 50% 40%,transparent 30%,rgba(8,6,4,.55) 70%,rgba(8,6,4,.92) 100%),
    linear-gradient(to bottom,rgba(8,6,4,.35),transparent 25%,transparent 45%,rgba(8,6,4,.85) 100%)}
.flash{position:absolute;inset:0;background:radial-gradient(circle at 50% 45%,rgba(255,200,120,.55),transparent 60%);
  opacity:0;pointer-events:none;animation:flash 1.4s ease-out .2s forwards}
@keyframes flash{0%{opacity:0}15%{opacity:1}100%{opacity:0}}

/* ================= 히어로 ================= */
.hero{position:relative;z-index:2;height:100%;display:flex;flex-direction:column;align-items:center;
  justify-content:center;padding:calc(env(safe-area-inset-top) + 24px) 20px calc(env(safe-area-inset-bottom) + 24px);
  text-align:center;overflow-y:auto}
.gamelogo{width:min(250px,64vw);opacity:0;filter:drop-shadow(0 6px 18px rgba(0,0,0,.8));
  animation:emblemIn 1.1s var(--ease) .6s forwards}
@keyframes emblemIn{from{opacity:0;transform:translateY(-14px) scale(.85)}to{opacity:1;transform:none}}

@keyframes fadeDown{from{opacity:0;transform:translateY(-10px);letter-spacing:.6em}to{opacity:1;transform:none}}

.title{position:relative;margin-top:18px;font-family:'Dokdo',cursive;font-weight:400;line-height:.95;
  font-size:clamp(66px,20vw,132px);color:#fbf4e6;letter-spacing:-.06em;
  -webkit-text-stroke:.045em #fbf4e6;paint-order:stroke fill;
  text-shadow:0 0 1px #fff,0 4px 0 rgba(0,0,0,.35),0 10px 30px rgba(0,0,0,.85),0 0 40px rgba(255,190,110,.25);
  clip-path:inset(-40% 100% -40% -20%);filter:blur(6px);
  animation:inkReveal 1.1s cubic-bezier(.6,.05,.2,1) 1.3s forwards}
.title small{display:block;font-size:.52em;line-height:1.1;margin-top:4px;color:#f3e6cc;-webkit-text-stroke:.04em #f3e6cc;letter-spacing:-.03em}
@keyframes inkReveal{0%{clip-path:inset(-40% 100% -40% -20%);filter:blur(6px);transform:scale(1.08)}
  70%{filter:blur(0)}100%{clip-path:inset(-40% -20% -40% -20%);filter:none;transform:scale(1)}}

.band{position:relative;width:min(340px,82vw);height:66px;margin-top:-6px;
  clip-path:inset(-40% 100% -40% -10%);animation:wipe .7s cubic-bezier(.7,0,.2,1) 2.15s forwards}
.band svg{position:absolute;inset:0;width:100%;height:100%;filter:drop-shadow(0 6px 10px rgba(0,0,0,.6))}
.band span{position:relative;display:flex;align-items:center;justify-content:center;height:100%;
  font-family:'Song Myung',serif;font-size:clamp(20px,6vw,26px);letter-spacing:.12em;color:#fff;
  text-shadow:0 2px 4px rgba(60,0,0,.8)}
@keyframes wipe{to{clip-path:inset(-40% -10% -40% -10%)}}

/* ================= 로그인 창 ================= */
.panel{position:relative;width:min(360px,100%);margin-top:28px;padding:26px 22px 20px;
  background:linear-gradient(180deg,rgba(26,22,18,.78),rgba(13,11,9,.88));
  border:1px solid rgba(216,178,106,.55);border-radius:4px;
  box-shadow:0 0 0 4px rgba(13,11,9,.6),0 0 0 5px rgba(216,178,106,.25),0 24px 60px rgba(0,0,0,.7);
  backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px);
  opacity:0;transform:translateY(24px);animation:panelIn .9s var(--ease) 2.8s forwards}
@keyframes panelIn{to{opacity:1;transform:none}}
.panel::before,.panel::after,.panel .c3,.panel .c4{content:"";position:absolute;width:14px;height:14px;
  border:2px solid var(--gold)}
.panel::before{top:-3px;left:-3px;border-right:0;border-bottom:0}
.panel::after{top:-3px;right:-3px;border-left:0;border-bottom:0}
.panel .c3{bottom:-3px;left:-3px;border-right:0;border-top:0}
.panel .c4{bottom:-3px;right:-3px;border-left:0;border-top:0}
.panel h2{font-family:'Song Myung',serif;font-weight:400;font-size:17px;color:var(--gold);letter-spacing:.2em;margin-bottom:18px;
  display:flex;align-items:center;gap:10px;justify-content:center}
.panel h2::before,.panel h2::after{content:"";height:1px;flex:1;max-width:60px;background:linear-gradient(90deg,transparent,var(--gold))}
.panel h2::after{transform:scaleX(-1)}
.field{position:relative;margin-bottom:14px;text-align:left}
.field label{display:block;font-size:12px;color:var(--muted);letter-spacing:.08em;margin-bottom:6px}
.field input{width:100%;padding:12px 2px 10px;background:transparent;border:0;border-bottom:1px solid rgba(216,178,106,.35);
  font-size:17px;outline:none;color:var(--paper);border-radius:0;transition:border-color .2s}
.field input:focus{border-bottom-color:var(--gold)}
.field input::placeholder{color:rgba(181,166,140,.45)}
.enter{position:relative;width:100%;margin-top:10px;padding:14px;border:0;border-radius:3px;cursor:pointer;
  font-family:'Song Myung',serif;font-size:18px;letter-spacing:.4em;text-indent:.4em;color:#2a1a08;
  background:linear-gradient(180deg,#f0cf86,#d8a947 55%,#b8862f);
  box-shadow:inset 0 1px 0 rgba(255,255,255,.5),inset 0 -2px 0 rgba(0,0,0,.2),0 6px 18px rgba(216,169,71,.25);
  overflow:hidden;transition:transform .15s}
.enter:active{transform:scale(.98)}
.enter::after{content:"";position:absolute;top:0;left:-60%;width:40%;height:100%;
  background:linear-gradient(100deg,transparent,rgba(255,255,255,.55),transparent);transform:skewX(-20deg);
  animation:shine 3.5s ease-in-out 3.8s infinite}
@keyframes shine{0%{left:-60%}35%,100%{left:130%}}
.enter:disabled{filter:grayscale(.6) brightness(.8);cursor:default}
.enter:disabled::after{display:none}
.err{min-height:20px;margin-top:12px;font-size:13px;color:#ff8a7a}
.hint{margin-top:4px;font-size:12px;color:var(--muted)}
.panel.shake{animation:shake .4s}
@keyframes shake{20%,60%{transform:translateX(-8px)}40%,80%{transform:translateX(8px)}}

/* 카카오톡 안내 */
.kakao{position:fixed;z-index:20;left:12px;right:12px;top:calc(env(safe-area-inset-top) + 12px);
  background:rgba(254,229,0,.96);color:#3a1d1d;border-radius:12px;padding:12px 14px;font-size:13px;
  display:flex;gap:10px;align-items:center;box-shadow:0 8px 24px rgba(0,0,0,.4);animation:panelIn .5s var(--ease) forwards}
.kakao b{display:block;font-size:14px}
.kakao button{flex:0 0 auto;border:0;background:#3a1d1d;color:#fee500;border-radius:8px;padding:8px 10px;font-size:12.5px;font-weight:700;cursor:pointer}

.skip-tip{position:fixed;z-index:3;bottom:calc(env(safe-area-inset-bottom) + 14px);left:0;right:0;text-align:center;
  font-size:11px;letter-spacing:.2em;color:rgba(239,228,207,.45);animation:tipOut .4s 2.8s forwards}
@keyframes tipOut{to{opacity:0;visibility:hidden}}

/* 인트로 건너뛰기: 모든 등장 애니메이션 즉시 완료 */
.skip .bg,.skip .gamelogo,.skip .title,.skip .band,.skip .panel{animation-duration:.01s!important;animation-delay:0s!important}
.skip .skip-tip{display:none}

/* ================= 입장 전환 ================= */
.gate{position:fixed;inset:0;z-index:30;pointer-events:none;display:flex}
.gate i{flex:1;background:linear-gradient(90deg,#0d0b09,#1c1712);transform:scaleX(0)}
.gate i:first-child{transform-origin:left;border-right:1px solid rgba(216,178,106,.5)}
.gate i:last-child{transform-origin:right;border-left:1px solid rgba(216,178,106,.5)}
.gate.close i{animation:gateClose .55s cubic-bezier(.7,0,.3,1) forwards}
.gate.open i{transform:scaleX(1);animation:gateOpen .7s cubic-bezier(.7,0,.3,1) .1s forwards}
@keyframes gateClose{to{transform:scaleX(1)}}
@keyframes gateOpen{to{transform:scaleX(0)}}
.welcome{position:fixed;inset:0;z-index:31;display:flex;flex-direction:column;align-items:center;justify-content:center;
  gap:10px;pointer-events:none;opacity:0;transition:opacity .3s}
.welcome.on{opacity:1}
.welcome img{width:64px;filter:drop-shadow(0 0 16px rgba(216,178,106,.6))}
.welcome p{font-family:'Song Myung',serif;font-size:20px;letter-spacing:.1em;color:var(--gold)}


@media (min-width:900px){
  .gamelogo{width:300px}
}
@media (prefers-reduced-motion:reduce){
  .bg img,.smoke{animation:none}
  .bg,.gamelogo,.title,.band,.panel{animation-duration:.01s!important;animation-delay:0s!important}
  .flash,.skip-tip{display:none}
}
</style>
</head>
<body>

<div id="stage" aria-hidden="true">
  <div class="bg">
    <img src="icon/hero.jpg" alt="">
    <video id="bgVideo" muted loop playsinline preload="auto" poster="icon/hero-poster.jpg"></video>
  </div>
  <div class="smoke"></div>
  <div class="smoke s2"></div>
  <canvas id="embers"></canvas>
  <div class="vignette"></div>
  <div class="flash"></div>
</div>

<div id="kakao" class="kakao" hidden>
  <div style="flex:1"><b>카카오톡 안에서 열렸어요</b>기본 브라우저로 열면 다음부터 로그인 없이 바로 들어올 수 있어요.</div>
  <button type="button" id="kakaoOpen">브라우저로 열기</button>
</div>

<main class="hero" id="hero">
  <img class="gamelogo" id="gameLogo" alt="임진왜란 - 조선의 반격">
  <h1 class="title" id="title"></h1>
  <div class="band" aria-label="KOREADEER 상단">
    <svg viewBox="0 0 600 110" preserveAspectRatio="none" aria-hidden="true">
      <defs>
        <filter id="rough" x="-5%" y="-20%" width="110%" height="140%">
          <feTurbulence type="fractalNoise" baseFrequency=".035 .5" numOctaves="3" seed="7" result="n"/>
          <feDisplacementMap in="SourceGraphic" in2="n" scale="22" xChannelSelector="R" yChannelSelector="G"/>
        </filter>
        <linearGradient id="redg" x1="0" x2="0" y1="0" y2="1">
          <stop offset="0" stop-color="#c9372a"/><stop offset=".55" stop-color="#a3241c"/><stop offset="1" stop-color="#6e140f"/>
        </linearGradient>
      </defs>
      <path filter="url(#rough)" fill="url(#redg)"
        d="M18 52 C40 30 90 24 150 22 L470 16 C520 15 560 20 585 30 L578 44 C590 52 592 64 580 72 L560 86
           C520 94 470 92 420 94 L140 96 C90 97 50 92 22 80 L34 70 C14 66 8 60 18 52 Z"/>
      <path filter="url(#rough)" fill="#7a1610" opacity=".55"
        d="M60 84 C150 92 300 88 450 86 L560 84 C520 98 420 100 300 101 C200 102 110 100 60 84 Z"/>
    </svg>
    <span id="subtitle">KOREADEER 상단</span>
  </div>

  <form class="panel" id="panel" autocomplete="on" novalidate>
    <i class="c3"></i><i class="c4"></i>
    <h2>입 장</h2>
    <div class="field">
      <label for="nick">본캐 닉네임</label>
      <input id="nick" name="nickname" maxlength="20" autocomplete="nickname" placeholder="게임 속 본캐 닉네임" required>
    </div>
    <div class="field">
      <label for="pw">상단 비밀번호</label>
      <input id="pw" name="password" type="password" autocomplete="current-password" placeholder="공지된 비밀번호" required>
    </div>
    <button class="enter" id="enterBtn">입장하기</button>
    <div class="err" id="err" role="alert"></div>
    <p class="hint">처음 한 번만 입력하면 다음부터 바로 열립니다.</p>
  </form>
</main>

<p class="skip-tip" id="skipTip">화면을 누르면 건너뛰기</p>

<div class="gate" id="gate"><i></i><i></i></div>
<div class="welcome" id="welcome"><img src="icon/emblem.png" alt=""><p id="welcomeText"></p></div>



<script>
/* =========================================================
   설정
   ========================================================= */
const CONFIG = {
  SCRIPT_URL: 'https://script.google.com/macros/s/AKfycby50UXAep9TnS_pUEouvTqDp2AD2XUoiE9DfoyGrw0TNyGfc4P5sinCxW9OlqN0PTp_kQ/exec',
  TITLE: '조선양록회',            // 제목 첫째 줄 (크게)
  TITLE_2: '& 슬로우라이프',       // 제목 둘째 줄 (작게, 비우면 한 줄)
  SUBTITLE: 'KOREADEER 상단',     // 붉은 띠 글자
  // 맨 위 게임 로고. GitHub에 올렸다면 'icon/logo.webp' 처럼 파일 이름만 적으세요.
  LOGO_URL: 'icon/logo2.webp',
  // 배경 영상 (비우면 아이콘 그림 + 효과만 사용)
  // 영상을 GitHub 저장소에 올렸다면 'hero-bg.mp4' 처럼 파일 이름만 적으세요.
  VIDEO_URL: 'hero-bg.mp4',
  MAX_FAILS: 5,          // 연속으로 틀릴 수 있는 횟수
  LOCK_SEC: 30           // 초과 시 잠금 시간(초)
};
const STORE = 'imjoban_auth';
const $ = id => document.getElementById(id);

$('title').textContent = CONFIG.TITLE;
if (CONFIG.TITLE_2){ const sm = document.createElement('small'); sm.textContent = CONFIG.TITLE_2; $('title').appendChild(sm); }
$('subtitle').textContent = CONFIG.SUBTITLE;
const logo = $('gameLogo');
if (CONFIG.LOGO_URL){ logo.src = CONFIG.LOGO_URL; logo.onerror = () => logo.remove(); } else logo.remove();

function load(){ try{ return JSON.parse(localStorage.getItem(STORE)); }catch(e){ return null; } }
function save(v){ try{ v ? localStorage.setItem(STORE, JSON.stringify(v)) : localStorage.removeItem(STORE); }catch(e){} }

/* ---------- 배경 영상 ---------- */
(function(){
  const v = $('bgVideo');
  if (!CONFIG.VIDEO_URL || matchMedia('(prefers-reduced-motion: reduce)').matches) { v.remove(); return; }
  v.src = CONFIG.VIDEO_URL;
  v.addEventListener('canplay', () => { v.play().then(() => v.classList.add('ready')).catch(() => {}); }, {once:true});
  v.addEventListener('error', () => v.remove());   // 실패하면 그림 배경 유지
})();

/* ---------- 불티 효과 ---------- */
(function(){
  const c = $('embers'), ctx = c.getContext('2d');
  if (matchMedia('(prefers-reduced-motion: reduce)').matches) return;
  let W, H, dpr, parts = [];
  function size(){
    dpr = Math.min(devicePixelRatio || 1, 2);
    W = c.clientWidth; H = c.clientHeight;
    c.width = W * dpr; c.height = H * dpr; ctx.setTransform(dpr,0,0,dpr,0,0);
    const n = Math.round(Math.min(90, Math.max(35, W * H / 14000)));
    parts = Array.from({length:n}, () => spawn(true));
  }
  function spawn(any){
    return { x: Math.random()*W, y: any ? Math.random()*H : H + 10,
      r: Math.random()*1.8 + .6, vy: Math.random()*0.7 + .35, vx: (Math.random()-.5)*.3,
      sway: Math.random()*Math.PI*2, life: Math.random()*.6 + .4, hue: 20 + Math.random()*25 };
  }
  function tick(){
    ctx.clearRect(0,0,W,H);
    ctx.globalCompositeOperation = 'lighter';
    for (const p of parts){
      p.sway += .02; p.y -= p.vy; p.x += p.vx + Math.sin(p.sway)*.35;
      const fade = Math.min(1, p.y / H * 1.6) * p.life * (0.6 + Math.random()*0.4);
      if (p.y < -10 || fade <= 0.02) Object.assign(p, spawn(false));
      const g = ctx.createRadialGradient(p.x,p.y,0,p.x,p.y,p.r*4);
      g.addColorStop(0, `hsla(${p.hue},100%,70%,${fade})`);
      g.addColorStop(.4, `hsla(${p.hue},100%,50%,${fade*.45})`);
      g.addColorStop(1, 'hsla(20,100%,40%,0)');
      ctx.fillStyle = g; ctx.beginPath(); ctx.arc(p.x,p.y,p.r*4,0,Math.PI*2); ctx.fill();
    }
    requestAnimationFrame(tick);
  }
  addEventListener('resize', size); size(); tick();
})();

/* ---------- 인트로 건너뛰기 ---------- */
let introDone = false;
setTimeout(() => introDone = true, 3700);
document.addEventListener('pointerdown', e => {
  if (introDone || e.target.closest('.panel,.kakao')) return;
  document.body.classList.add('skip'); introDone = true;
}, {passive:true});

/* ---------- 카카오톡 인앱 브라우저 안내 ---------- */
(function(){
  const ua = navigator.userAgent;
  if (!/KAKAOTALK/i.test(ua)) return;
  $('kakao').hidden = false;
  $('kakaoOpen').onclick = () => {
    const url = location.href;
    if (/android/i.test(ua)) location.href = 'intent://' + url.replace(/^https?:\/\//,'') + '#Intent;scheme=https;package=com.android.chrome;end';
    else location.href = 'kakaotalk://web/openExternal?url=' + encodeURIComponent(url);
  };
})();

/* ---------- 서버 요청 ---------- */
async function request(nick, pw){
  if (!CONFIG.SCRIPT_URL) return pw === '1234' ? {ok:true, data:{}} : {ok:false, error:'비밀번호가 맞지 않습니다.', code:'bad_pw'};
  for (let i = 0; i < 3; i++){           // 접속이 몰리면 조용히 재시도
    try{
      const res = await fetch(CONFIG.SCRIPT_URL, {method:'POST', body: JSON.stringify({nick, pw})});
      return await res.json();
    }catch(e){ if (i === 2) throw e; await new Promise(r => setTimeout(r, 700 * (i+1))); }
  }
}

/* ---------- 입장 연출 ---------- */
function enterSite(nick, data){
  try{ if (data) localStorage.setItem('imjoban_cache', JSON.stringify({at:Date.now(), data})); }catch(e){}
  try{ sessionStorage.setItem('imjoban_gate','1'); }catch(e){}
  const gate = $('gate');
  gate.className = 'gate close';
  setTimeout(() => {
    $('welcomeText').textContent = nick + '님, 어서 오세요';
    $('welcome').classList.add('on');
  }, 450);
  setTimeout(() => location.href = 'app.html', 1300);
}

/* ---------- 로그인 ---------- */
let fails = 0, lockUntil = 0;
function setErr(msg){ $('err').textContent = msg || ''; }
function shake(){ const p = $('panel'); p.classList.remove('shake'); void p.offsetWidth; p.classList.add('shake'); }

$('panel').addEventListener('submit', async e => {
  e.preventDefault();
  const nick = $('nick').value.trim(), pw = $('pw').value;
  if (Date.now() < lockUntil){ setErr(`잠시 후 다시 시도해주세요 (${Math.ceil((lockUntil-Date.now())/1000)}초)`); return; }
  if (!nick){ setErr('닉네임을 입력해주세요.'); $('nick').focus(); shake(); return; }
  if (!pw){ setErr('비밀번호를 입력해주세요.'); $('pw').focus(); shake(); return; }
  const btn = $('enterBtn'); btn.disabled = true; btn.textContent = '확인 중'; setErr('');
  try{
    const r = await request(nick, pw);
    if (r.ok){ fails = 0; save({nick, pw}); enterSite(nick, r.data); return; }
    if (r.code === 'bad_pw'){
      fails++;
      if (fails >= CONFIG.MAX_FAILS){ lockUntil = Date.now() + CONFIG.LOCK_SEC*1000; fails = 0;
        setErr(`비밀번호를 여러 번 틀렸어요. ${CONFIG.LOCK_SEC}초 뒤에 다시 시도해주세요.`); }
      else setErr(`${r.error} (${CONFIG.MAX_FAILS - fails}번 남음)`);
      $('pw').select();
    } else setErr(r.error || '입장에 실패했어요.');
    shake();
  }catch(err){
    setErr('연결이 원활하지 않아요. 잠시 후 다시 시도해주세요.'); shake();
  }finally{
    btn.disabled = false; btn.textContent = '입장하기';
  }
});


/* ---------- 이미 로그인한 사람: 짧은 인트로 후 자동 입장 ---------- */
(async function(){
  const auth = load();
  if (!auth || !auth.nick) return;
  $('panel').hidden = true; $('skipTip').hidden = true;
  const started = Date.now();
  try{
    const r = await request(auth.nick, auth.pw);
    if (!r.ok){ save(null); $('panel').hidden = false; document.body.classList.add('skip'); setErr(r.error || '다시 로그인해주세요.'); return; }
    setTimeout(() => enterSite(auth.nick, r.data), Math.max(0, 2600 - (Date.now() - started)));
  }catch(e){
    // 오프라인이어도 우선 입장 (메인에서 저장된 내용을 보여줄 예정)
    setTimeout(() => enterSite(auth.nick, null), 2600);
  }
})();
</script>
